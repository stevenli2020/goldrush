variable_id: L5-001
variable_name: Monthly Official-Sector Gold Purchase Volume
frequency: monthly
source:
  provider: World Gold Council
  workbook_sheet: Monthly
  unit: metric_tonnes
validation:
  negative_values_allowed: true
  aggregation: sum_canonical_country_series
  excluded_rows: labels ending with '*', including gross Turkey*
  included_adjusted_series: Turkey
fallback:
  method: carry_forward_stale
  scoring_requires_operator_approval: true

# L0-001 — Above-Ground Gold Stock collector configuration
variable:
  id: L0-001
  name: Above-Ground Gold Stock
  frequency: annual

collector:
  script: scripts/parse_above_ground.py
  parser_version: "1.0.0"
  worksheet: "Above-ground stocks"

source:
  provider: World Gold Council
  page_url: https://www.gold.org/goldhub/data/how-much-gold
  download_url: https://www.gold.org/download/file/7588/above-ground-gold-stocks.xlsx
  citation: "Metals Focus, Refinitiv GFMS, World Gold Council"
  format: xlsx
  coverage_start: 2010

storage:
  raw_dir: data/raw
  processed_dir: data/processed
  samples_dir: data/samples
  archive_dir: data/archive
  raw_filename_pattern: "raw_wgc_above_ground_stock_{YYYYMMDD}.xlsx"

outputs:
  csv: above_ground_stocks.csv
  parquet: above_ground_stocks.parquet
  warnings_log: validation_warnings.log
  revision_log: revision_log.json

validation:
  sum_tolerance_tonnes: 0.0001
  non_negative_values: true
  missing_or_malformed_values: fail
  yoy_change: warning

freshness:
  frequency: annual
  stale_after_months: 18
  unusable_after_months: 24
  fallback: carry_forward_as_stale

variable:
  id: L3-006
  name: FOMC Statements / Forward-Guidance Signal
  frequency: event
source:
  provider: Board of Governors of the Federal Reserve System
  primary: official FOMC statement HTML
  supporting: matching official statement PDF
annotation:
  mode: operator_reviewed_only
  binding: normalized_statement_text_sha256
  allowed_signals: [DOVISH, NEUTRAL, HAWKISH, MIXED, UNCLASSIFIED]
parser:
  script: parser.py
  version: "0.2.0"
  stale_after_days: 60
fallback:
  method: carry_forward_latest_statement
  status: STALE
  no_prior_status: BLOCKED
